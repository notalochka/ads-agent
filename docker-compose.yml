services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    environment:
      - NODE_ENV=production
      - ADS_SOURCE=mock
      - LLM_PROVIDER=mock
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - ./tests/fixtures:/app/tests/fixtures:ro

